    yearlymonthdayreverse: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nthrev :integer select=ordinal}
      .local $weekday = {$date :date weekday=long}
      .input {$weekdaynum :integer}
      .local $month = {$date :date month=long}
      .input {$monthnum :integer}
      .match $interval $monthnum $nthrev $weekdaynum
                one 0 1 0 {{Corocznie w ostatnią niedzielę stycznia}}
        one 0 1 3 {{Corocznie w ostatnią środę stycznia}}
        one 0 1 6 {{Corocznie w ostatnią sobotę stycznia}}
        one 0 1 * {{Corocznie w ostatni {$weekday} stycznia}}
        one 0 2 0 {{Corocznie w przedostatnią niedzielę stycznia}}
        one 0 2 3 {{Corocznie w przedostatnią środę stycznia}}
        one 0 2 6 {{Corocznie w przedostatnią sobotę stycznia}}
        one 0 2 * {{Corocznie w przedostatni {$weekday} stycznia}}
        one 0 3 0 {{Corocznie w trzecią niedzielę stycznia od końca}}
        one 0 3 3 {{Corocznie w trzecią środę stycznia od końca}}
        one 0 3 6 {{Corocznie w trzecią sobotę stycznia od końca}}
        one 0 3 * {{Corocznie w trzeci {$weekday} stycznia od końca}}
        one 0 4 0 {{Corocznie w czwartą niedzielę stycznia od końca}}
        one 0 4 3 {{Corocznie w czwartą środę stycznia od końca}}
        one 0 4 6 {{Corocznie w czwartą sobotę stycznia od końca}}
        one 0 4 * {{Corocznie w czwarty {$weekday} stycznia od końca}}
