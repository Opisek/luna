recurrence:
  repeats: "Wiederkehrend"
  advanced: "Fortgeschrittene Wiederholungsbestimmung"
  presets:
    custom: "Benutzerdefiniert"
    daily: |
      .input {$interval :integer}
      .match $interval
        1 {{Jeden Tag}}
        * {{Jeden {$interval}ten Tag}}
    dailyworkdays: |
      .input {$interval :integer}
      .match $interval
        1 {{Jeden Wochentag}}
        * {{Jeden {$interval}ten Wochentag}}
    monthlydate: |
      .input {$interval :integer}
      .input {$day :integer select=ordinal}
      .match $interval $day
        1 * {{Monatlich am {$day}ten}}
        * * {{Alle {$interval} Monate am {$day}ten}}
    monthlyday: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nth :integer}
      .local $weekday = {$date :date weekday=long}
      .match $interval $nth
        1 1 {{Monatlich am ersten {$weekday}}}
        1 2 {{Monatlich am zweiten {$weekday}}}
        1 3 {{Monatlich am dritten {$weekday}}}
        1 4 {{Monatlich am vierten {$weekday}}}
        1 * {{Monatlich am fünften {$weekday}}}
        * 1 {{Alle {$interval} Monate am ersten {$weekday}}}
        * 2 {{Alle {$interval} Monate am zweiten {$weekday}}}
        * 3 {{Alle {$interval} Monate am dritten {$weekday}}}
        * 4 {{Alle {$interval} Monate am vierten {$weekday}}}
        * * {{Alle {$interval} Monate am fünften {$weekday}}}
    monthlydayreverse: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nthrev :integer select=ordinal}
      .local $weekday = {$date :date weekday=long}
      .match $interval $nthrev
        1 1 {{Monatlich am letzten {$weekday}}}
        1 2 {{Monatlich am zweitletzten {$weekday}}}
        1 3 {{Monatlich am drittletzten {$weekday}}}
        1 4 {{Monatlich am viertletzten {$weekday}}}
        1 * {{Monatlich am fünftletzten {$weekday}}}
        * 1 {{Alle {$interval} Monate am letzten {$weekday}}}
        * 2 {{Alle {$interval} Monate am zweitletzten {$weekday}}}
        * 3 {{Alle {$interval} Monate am drittletzten {$weekday}}}
        * 4 {{Alle {$interval} Monate am viertletzten {$weekday}}}
        * * {{Alle {$interval} Monate am fünftletzten {$weekday}}}
    yearlydate: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$day :integer select=ordinal}
      .local $month = {$date :date month=long}
      .match $interval $day
        1 * {{Jählich am {$day}ten {$month}}}
        * * {{Alle {$interval} Jahre am {$day}ten {$month}}}
    yearlymonthday: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nth :integer select=ordinal}
      .local $weekday = {$date :date weekday=long}
      .local $month = {$date :date month=long}
      .match $interval $nth
        1 1 {{Jählich am ersten {$weekday} im {$month}}}
        1 2 {{Jählich am zweiten {$weekday} im {$month}}}
        1 3 {{Jählich am dritten {$weekday} im {$month}}}
        1 4 {{Jählich am vierten {$weekday} im {$month}}}
        1 * {{Jählich am fünften {$weekday} im {$month}}}
        * 1 {{Alle {$interval} Jahre am ersten {$weekday} im {$month}}}
        * 2 {{Alle {$interval} Jahre am zweiten {$weekday} im {$month}}}
        * 3 {{Alle {$interval} Jahre am dritten {$weekday} im {$month}}}
        * 4 {{Alle {$interval} Jahre am vierten {$weekday} im {$month}}}
        * * {{Alle {$interval} Jahre am fünften {$weekday} im {$month}}}
    yearlymonthdayreverse: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nthrev :integer select=ordinal}
      .local $weekday = {$date :date weekday=long}
      .local $month = {$date :date month=long}
      .match $interval $nthrev
        1 1 {{Jählich am letzten {$weekday} im {$month}}}
        1 2 {{Jählich am zweitletzten {$weekday} im {$month}}}
        1 3 {{Jählich am drittletzten {$weekday} im {$month}}}
        1 4 {{Jählich am viertletzten {$weekday} im {$month}}}
        1 * {{Jählich am fünftletzten {$weekday} im {$month}}}
        * 1 {{Alle {$interval} Jahre am letzten {$weekday} im {$month}}}
        * 2 {{Alle {$interval} Jahre am zweitletzten {$weekday} im {$month}}}
        * 3 {{Alle {$interval} Jahre am drittletzten {$weekday} im {$month}}}
        * 4 {{Alle {$interval} Jahre am viertletzten {$weekday} im {$month}}}
        * * {{Alle {$interval} Jahre am fünftletzten {$weekday} im {$month}}}
    weekly: |
      .input {$interval :integer}
      .match $interval
        1 {{Wöchentlich}}
        * {{Alle {$interval} Wochen}}
  props:
    freq:
      name: "Frequenz"
      vals:
        secondly: "Sekündlich"
        minutely: "Minütlich"
        hourly: "Stündlich"
        daily: "Täglich"
        weekly: "Wöchentlich"
