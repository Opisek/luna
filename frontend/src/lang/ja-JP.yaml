numbers:
  ordinal:
    normal: |
      .input {$num :integer select=ordinal}
      .match $num
        one {{{$num}st}}
        two {{{$num}nd}}
        few {{{$num}rd}}
        * {{{$num}th}}
    reverse: |
      .input {$num :integer select=ordinal}
      .match $num
        1 {{last}}
        one {{{$num}st to last}}
        two {{{$num}nd to last}}
        few {{{$num}rd to last}}
        * {{{$num}th to last}}