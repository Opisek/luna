recurrence:
  repeats: "Répétition"
  presets:
    custom: "Personnalisé"
    daily: |
      .input {$interval :integer}
      .match $interval
        1 {{Tous les jours}}
        2 {{Tous les deux jours}}
        * {{Tous les {$interval} jours}}
    dailyweekdays: |
      .input {$interval :integer}
      .match $interval
        1 {{Tous les jours en semaine}}
        2 {{Tous les deux jours en semaine}}
        * {{Tous les {$interval} jours en semaine}}
    monthlydate: |
      .input {$interval :integer}
      .input {$day :ordinal}
      .match $interval
        1 {{Tous les mois le {$day}}}
        2 {{Tous les deux mois le {$day}}}
        * {{Tous les {$interval} mois le {$day}}}
    monthlyday: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nth :ordinal}
      .local $weekday = {$date :weekday weekday=long}
      .match $interval
        1 {{Tous les mois le {$nth} {$weekday}}}
        2 {{Tous les deux mois le {$nth} {$weekday}}}
        * {{Tous les {$interval} mois le {$nth} {$weekday}}}
    monthlydayreverse: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nthrev :ordinal order=reverse}
      .local $weekday = {$date :weekday weekday=long}
      .match $interval
        1 {{Tous les mois le {$nthrev} {$weekday}}}
        2 {{Tous les deux mois le {$nthrev} {$weekday}}}
        * {{Tous les {$interval} mois le {$nthrev} {$weekday}}}
    yearlydate: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$day :ordinal}
      .local $month = {$date :month month=long}
      .match $interval
        1 {{Tous les ans le {$day} {$month}}}
        2 {{Tous les deux ans le {$day} {$month}}}
        * {{Tous les {$interval} ans le {$day} {$month}}}
    yearlymonthday: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nth :ordinal}
      .local $weekday = {$date :weekday weekday=long}
      .local $month = {$date :month month=long}
      .match $interval
        1 {{Tous les ans le {$nth} {$weekday} de {$month}}}
        2 {{Tous les deux ans le {$nth} {$weekday} de {$month}}}
        * {{Tous les {$interval} ans le {$nth} {$weekday} de {$month}}}
    yearlymonthdayreverse: |
      .input {$interval :integer}
      .input {$date :integer}
      .input {$nthrev :ordinal order=reverse}
      .local $weekday = {$date :weekday weekday=long}
      .local $month = {$date :month month=long}
      .match $interval
        1 {{Tous les ans le {$nthrev} {$weekday} de {$month}}}
        2 {{Tous les deux ans le {$nthrev} {$weekday} de {$month}}}
        * {{Tous les {$interval} ans le {$nthrev} {$weekday} de {$month}}}
    weekly: |
      .input {$interval :integer}
      .match $interval
        1 {{Toutes les semaines}}
        2 {{Toutes les deux semaines}}
        * {{Toutes les {$interval} semaines}}
  props:
    freq:
      name: "Fréquence"
      vals:
        secondly: "Toutes les secondes"
        minutely: "Toutes les minutes"
        hourly: "Toutes les heures"
        daily: "Quotidienne"
        weekly: "Hebdomadaire"
        monthly: "Mensuelle"
        yearly: "Annuelle"
    interval:
      name: "Intervalle"
    duration:
      name: "Durée"
      vals:
        date:
          name: "Jusqu'à une date précise"
          param: "Fin de la récurrence"
        count:
          name: "Nombre de répétitions"
          param: "Nombre d'événements"
        forever: "Indéfiniment"
    rrule: "RRULE"
    rdate: "RDATE"
    exdate: "EXDATE"
    by:
      month:
        limit:
          enable: "Uniquement pendant certains mois"
          name: "Mois"
        expand:
          enable: "Spécifier des mois de l'année"
          name: "Mois"
      weekno:
        expand:
          enable: "Spécifier des semaines de l'année"
          name: "Numéros de semaine"
      yearday:
        limit:
          enable: "Uniquement certains jours de l'année"
          name: "Jours de l'année"
        expand:
          enable: "Spécifier des jours de l'année"
          name: "Jours de l'année"
      monthday:
        limit:
          enable: "Uniquement certains jours du mois"
          name: "Jours du mois"
        expand:
          enable: "Spécifier des jours du mois"
          name: "Jours du mois"
      day:
        dayname:
          limit:
            enable: "Uniquement certains jours de la semaine"
            name: "Jours de la semaine"
          expand:
            enable: "Spécifier des jours de la semaine"
            name: "Jours de la semaine"
        numeric:
          limit:
            enable: "Uniquement certains jours de la semaine"
            name: "Jours de la semaine"
          expand:
            enable: "Spécifier des jours de la semaine"
            name: "Jours de la semaine"
      hour:
