numbers:
  ordinal:
    normal: |
      .input {$num :integer select=ordinal}
      .match $num
        one {{{$num}er}}
        * {{{$num}e}}
    reverse: |
      .input {$num :integer select=ordinal}
      .match $num
        1 {{dernier}}
        * {{{$num}e en partant de la fin}}