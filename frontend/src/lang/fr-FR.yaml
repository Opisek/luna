      info: "Permet à n'importe qui de créer un compte.\nSi vous souhaitez seulement inviter quelques personnes, rendez-vous dans l'onglet « Utilisateurs »."
    geolocation:
      display: "Déterminer la géolocalisation des adresses IP"
      info: "Ce paramètre permet au frontend d'afficher une localisation approximative des sessions de l'utilisateur sur sa page de paramètres. Cette fonctionnalité vise à aider les utilisateurs à détecter si des acteurs malveillants ont accès à leur compte. Comme déterminer la géolocalisation d'une adresse IP nécessite le recours à un service tiers, son utilisation soulève des questions de confidentialité. Si vous préférez ne pas utiliser cette fonctionnalité, elle peut être désactivée ici. Notez que les adresses IP elles-mêmes resteront stockées dans la base de données à des fins de sécurité et d'audit, mais elles ne sont jamais partagées avec un tiers en dehors du comportement contrôlé par cette option."
    pfp:
      gravatar:
        display: "Activer les photos de profil Gravatar"
        info: "Gravatar est un service tiers qui permet aux utilisateurs de définir leur photo de profil une seule fois et de l'associer à leur adresse e-mail. Cela fonctionne en interrogeant ce serveur avec un hachage MD5 de l'adresse e-mail de l'utilisateur. Cela peut être vu comme un problème de confidentialité, car cela permet à Gravatar de suivre les utilisateurs à travers différents services. Si vous préférez ne pas utiliser les photos de profil Gravatar, vous pouvez les désactiver ici. Ce paramètre désactive l'utilisation de Gravatar sur l'ensemble du site."
      cache:
        display: "Mettre en cache les photos de profil"
        info: "Détermine si les photos de profil provenant de sites distants (y compris Gravatar) doivent être mises en cache localement. Mettre en cache les photos de profil peut améliorer les performances et la confidentialité, mais cela introduit le risque d'héberger du contenu illicite si un utilisateur malveillant l'utilise comme photo de profil. Le même risque existe si les utilisateurs importent directement leur photo de profil."
      upload:
        display: "Activer l'import des photos de profil"
        info: "Permet aux utilisateurs d'importer leur propre photo de profil directement sur le serveur. Cela introduit le risque d'héberger du contenu illicite si un utilisateur malveillant importe une telle image comme photo de profil. Le même risque existe si la mise en cache des photos de profil distantes est activée."
    verbosity:
      display: "Niveau de détail des messages d'erreur"
      info: "Quantité d'informations sur les erreurs renvoyée à l'utilisateur.\nCe paramètre s'applique à tous les utilisateurs.\n« Debug » ne devrait jamais être utilisé en production."
      lvl:
